name: Plugin build and release

# Builds the VST3 plug-in and the standalone app on Windows, runs the plug-in tests and
# publishes a GitHub pre-release with the binaries on every push to main that touches
# the plug-in. Python-only and docs-only pushes are covered by the CI workflow instead.
on:
  push:
    branches: [main]
    paths:
      - "plugin/**"
      - "tools/export_params.py"
      - "tools/gen_plugin_params.py"
      - ".github/workflows/plugin-release.yml"
  workflow_dispatch:

concurrency:
  group: plugin-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      VERSION: "0.1.0"
    steps:
      - uses: actions/checkout@v4

      - name: Load the MSVC environment
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio/Installer/vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the C++ tools was found" }
          Write-Host "Using $vs"
          $vcvars = Join-Path $vs "VC/Auxiliary/Build/vcvars64.bat"
          cmd /c "`"$vcvars`" >nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { "$($Matches[1])=$($Matches[2])" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV }
          }

      - name: Configure
        run: cmake -S plugin -B plugin/build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build plugin/build

      - name: Test
        run: ctest --test-dir plugin/build --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $tag = "v$env:VERSION-build.${{ github.run_number }}"
          "TAG=$tag" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          $art = "plugin/build/SnakeOilSynth_artefacts/Release"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$art/VST3/SnakeOil Synth.vst3" -DestinationPath "dist/SnakeOil-Synth-$tag-VST3-win64.zip"
          Compress-Archive -Path "$art/Standalone/SnakeOil Synth.exe" -DestinationPath "dist/SnakeOil-Synth-$tag-Standalone-win64.zip"
          Copy-Item docs/manual/SnakeOil-Synth-User-Manual.pdf dist/
          Get-ChildItem dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG dist/* `
            --target ${{ github.sha }} `
            --title "SnakeOil Synth $env:TAG" `
            --prerelease `
            --generate-notes
